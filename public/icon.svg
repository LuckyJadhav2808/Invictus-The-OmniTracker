<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="invictus-stem" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#CEF431" />
      <stop offset="100%" stop-color="#03D26F" />
    </linearGradient>
    <linearGradient id="invictus-rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2A2724" />
      <stop offset="100%" stop-color="#161514" />
    </linearGradient>
  </defs>
  <!-- Background Squircle with Subtle Hairline Rim -->
  <rect width="512" height="512" rx="120" fill="#161514" />
  <rect x="2" y="2" width="508" height="508" rx="118" fill="none" stroke="url(#invictus-rim)" stroke-width="3" />
  
  <g id="icon" transform="translate(256, 256)">
    <!-- Top Crown Pediment (Cream Architectural Plate) -->
    <path d="M -130 -160 L 130 -160 L 96 -96 L -96 -96 Z" fill="#FAF8F5" />
    
    <!-- Central Monolithic Stem (Vibrant Electric Lime into Malachite Emerald) -->
    <path d="M -56 -78 L 56 -78 L 56 78 L -56 78 Z" fill="url(#invictus-stem)" />
    
    <!-- Ascending Victory Chevron (Negative Space / Ink Arrow) -->
    <path d="M 0 -44 L 38 12 L 18 12 L 0 -12 L -18 12 L -38 12 Z" fill="#161514" />
    
    <!-- Bottom Base Pedestal (Balanced Foundation) -->
    <path d="M -96 96 L 96 96 L 130 160 L -130 160 Z" fill="#FAF8F5" />
  </g>
</svg>
