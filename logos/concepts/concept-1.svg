<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Concept 1: The Apex Chevron (Unconquered Victory Monogram) -->
  <!-- Squircle Base -->
  <rect x="20" y="20" width="472" height="472" rx="112" fill="#161514" />
  
  <g id="icon" transform="translate(256, 256)">
    <!-- Left Wing (Electric Volt) -->
    <path
      d="M -120 -110 L -42 -110 L 0 50 L 0 130 Z"
      fill="#CEF431"
    />
    <!-- Right Wing (Crisp Off-White) -->
    <path
      d="M 120 -110 L 42 -110 L 0 50 L 0 130 Z"
      fill="#FAF8F5"
    />
    <!-- Center Victory Diamond Apex -->
    <polygon
      points="0,-80 32,-20 0,40 -32,-20"
      fill="#CEF431"
    />
  </g>
</svg>
