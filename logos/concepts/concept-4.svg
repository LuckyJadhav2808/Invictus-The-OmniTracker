<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Concept 4: The Omni Shield (Diamond Chevron / 4 Pillars of Mastery) -->
  <rect x="20" y="20" width="472" height="472" rx="112" fill="#161514" />
  
  <g id="icon" transform="translate(256, 256)">
    <!-- Top North Apex (Electric Volt - Focus & Vision) -->
    <path
      d="M 0 -150 L 95 -55 L 0 -15 L -95 -55 Z"
      fill="#CEF431"
    />
    
    <!-- Left Wing (Warm Cream - Habits & Daily Rhythm) -->
    <path
      d="M -115 -35 L -20 60 L -75 140 L -140 30 Z"
      fill="#FAF8F5"
    />
    
    <!-- Right Wing (Titanium Silver / Muted Light - Finances & Discipline) -->
    <path
      d="M 115 -35 L 20 60 L 75 140 L 140 30 Z"
      fill="#D9D6CE"
    />
    
    <!-- Bottom Keel (Emerald Green - Endurance & Streaks) -->
    <polygon
      points="0,80 50,150 0,165 -50,150"
      fill="#03D26F"
    />
  </g>
</svg>
