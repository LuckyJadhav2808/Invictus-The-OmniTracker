<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="invictus-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#165F47" />
      <stop offset="40%" stop-color="#2DA049" />
      <stop offset="75%" stop-color="#DBE64C" />
      <stop offset="100%" stop-color="#F2923B" />
    </linearGradient>
    <linearGradient id="inner-glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Shield Container -->
  <rect width="512" height="512" rx="128" fill="#111827" />
  
  <!-- Outer Glowing Ring -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="url(#invictus-grad)" stroke-width="12" filter="url(#glow)" opacity="0.8" />

  <!-- Shield Emblem Path -->
  <path d="M256 72 L392 128 V248 C392 344 332 416 256 448 C180 416 120 344 120 248 V128 L256 72 Z" fill="url(#invictus-grad)" />

  <!-- Inner Gloss Layer -->
  <path d="M256 88 L376 138 V248 C376 330 324 394 256 424 C188 394 136 330 136 248 V138 L256 88 Z" fill="url(#inner-glow)" />

  <!-- Monogram Spark 'I' -->
  <path d="M256 160 L280 230 L350 256 L280 282 L256 352 L232 282 L162 256 L232 230 Z" fill="#FFFFFF" />
</svg>
