name: 📱 Build Android APK

on:
  push:
    branches:
      - main
    paths:
      - 'android/**'
      - 'capacitor.config.ts'
      - '.github/workflows/build-apk.yml'
      - 'src/config/version.ts'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: 🤖 Compile Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: 📦 Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: ⚡ Install Native Android Bridge Plugins
        run: npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/local-notifications @capacitor/haptics @capacitor/splash-screen @capacitor/status-bar --no-audit --no-fund

      - name: 🔑 Grant Execute Permission for Gradlew
        run: chmod +x android/gradlew

      - name: 🏗️ Build Debug APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 📤 Upload Installable APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Invictus-Android-App
          path: android/app/build/outputs/apk/debug/Invictus.apk
          retention-days: 30

      - name: 🚀 Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.2.0
          name: Invictus Android v1.2.0
          files: android/app/build/outputs/apk/debug/Invictus.apk
          draft: false
          prerelease: false
          body: |
            ## 📱 Invictus for Android v1.2.0
            Official standalone APK release for Android devices.

            ### ✨ What's Included:
            - ⚡ 1-Tap Native Android Shortcuts (Expenses, Habits, Gym, Study)
            - 💳 High-Performance Money & Ledger Workspace
            - 🎨 Single-Row Tab Rail with Horizontal Momentum Swipe
            - 🧮 Neobrutalist Quick Calculator
            - 🛡️ Streak Freeze & Missed Log Protection Tokens
            - ✨ Native Haptic Feedback & Offline Cache Sync
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
